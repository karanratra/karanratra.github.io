<div class="cv-nested-list">
  {% for content in entry.contents %}
    <article class="cv-nested-item">
      <h3>{{ content.title }}</h3>
      {% if content.items %}
        <ul class="cv-subitems">
          {% for subitem in content.items %}
            <li>{{ subitem }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </article>
  {% endfor %}
</div>
