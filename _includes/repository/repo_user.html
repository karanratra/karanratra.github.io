<article class="repo repo-card repo-card--profile">
  <div class="repo-card-top">
    <div class="repo-card-icon" aria-hidden="true">
      <i class="fab fa-github"></i>
    </div>
    <div class="repo-card-meta">
      <p class="impact-label">GitHub Profile</p>
      <h3>{{ include.username }}</h3>
      <p class="repo-card-owner">Open-source activity and contribution snapshot</p>
    </div>
  </div>
  <div class="repo-card-body">
    <p class="repo-card-text">Primary public profile for repositories, contributions, and project history.</p>
  </div>
  <div class="repo-card-actions">
    <a class="repo-card-link" href="https://github.com/{{ include.username }}">Open profile</a>
  </div>
</article>
