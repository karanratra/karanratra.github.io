<article class="repo repo-card repo-card--summary">
  <div class="repo-card-top">
    <div class="repo-card-icon" aria-hidden="true">
      <i class="fas fa-chart-line"></i>
    </div>
    <div class="repo-card-meta">
      <p class="impact-label">Contribution Profile</p>
      <h3>{{ include.username }}</h3>
      <p class="repo-card-owner">Languages, projects, and public contribution overview</p>
    </div>
  </div>
  <div class="repo-card-body">
    <p class="repo-card-text">Use the GitHub profile to review repositories, activity, and contribution history in one place.</p>
  </div>
  <div class="repo-card-actions">
    <a class="repo-card-link" href="https://github.com/{{ include.username }}?tab=repositories">Browse repositories</a>
  </div>
</article>
