<!-- Lightbox2 JS -->
<script src="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/js/lightbox.min.js"></script>

<script>
  (function () {
    "use strict";

    let modalTrigger = null;

    const focusableSelector = [
      "a[href]", "button:not([disabled])", "input:not([disabled])",
      "select:not([disabled])", "textarea:not([disabled])", "[tabindex]:not([tabindex='-1'])"
    ].join(",");

    const closeVolunteeringModal = (modal) => {
      if (!modal || !modal.classList.contains("is-open")) return;

      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      window.dispatchEvent(new CustomEvent("site:modal-close", { detail: { modal } }));

      if (modalTrigger && document.contains(modalTrigger)) {
        modalTrigger.focus({ preventScroll: true });
      }
      modalTrigger = null;
    };

    document.querySelectorAll(".modal").forEach((modal) => {
      modal.setAttribute("aria-hidden", "true");
      const content = modal.querySelector(".modal-content");
      if (content) content.setAttribute("data-lenis-prevent", "");
    });

    document.querySelectorAll(".more-details-link").forEach((link) => {
      link.addEventListener("click", function (event) {
        event.preventDefault();
        const modal = document.getElementById(this.dataset.modal);
        if (!modal) return;

        modalTrigger = this;
        document.body.appendChild(modal);
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");

        const modalContent = modal.querySelector(".modal-content");
        if (modalContent) modalContent.scrollTop = 0;
        window.dispatchEvent(new CustomEvent("site:modal-open", { detail: { modal } }));

        const closeButton = modal.querySelector(".close-button");
        if (closeButton) closeButton.focus({ preventScroll: true });
      });
    });

    document.querySelectorAll(".close-button").forEach((button) => {
      button.addEventListener("click", function () {
        closeVolunteeringModal(document.getElementById(this.dataset.modal));
      });
    });

    window.addEventListener("click", (event) => {
      if (event.target.classList.contains("modal")) closeVolunteeringModal(event.target);
    });

    window.addEventListener("keydown", (event) => {
      const modal = document.querySelector(".modal.is-open");
      if (!modal) return;

      if (event.key === "Escape") {
        closeVolunteeringModal(modal);
        return;
      }

      if (event.key !== "Tab") return;
      const focusable = Array.from(modal.querySelectorAll(focusableSelector)).filter((element) => element.offsetParent !== null);
      if (!focusable.length) return;

      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
  }());
</script>
