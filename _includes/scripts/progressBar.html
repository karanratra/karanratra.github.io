{% if site.enable_progressbar %}
<!-- Scrolling Progress Bar -->
<script>
  (function () {
    "use strict";

    const progressBar = document.getElementById("progress");
    if (!progressBar) return;

    let scheduled = false;

    function distanceToScroll() {
      return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    }

    function update() {
      scheduled = false;
      const distance = distanceToScroll();
      progressBar.max = Math.max(1, distance);
      progressBar.value = Math.min(window.scrollY, distance);
    }

    function scheduleUpdate() {
      if (scheduled) return;
      scheduled = true;
      window.requestAnimationFrame(update);
    }

    function setup() {
      const navbar = document.getElementById("navbar");
      const navbarHeight = navbar ? navbar.getBoundingClientRect().height : 0;
      document.body.style.paddingTop = navbarHeight + "px";
      progressBar.style.top = navbarHeight + "px";
      update();
      if (window.siteScroll) window.siteScroll.resize();
    }

    window.addEventListener("load", setup);
    window.addEventListener("scroll", scheduleUpdate, { passive: true });
    window.addEventListener("site:scroll", scheduleUpdate);
    window.addEventListener("resize", setup, { passive: true });
  }());
</script>
{% endif %}
