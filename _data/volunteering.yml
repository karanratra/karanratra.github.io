- title: "Judge – NASA Space Apps Challenge 2025"
  organization: "NASA Space Apps Challenge"
  year: "2025"
  logo: "/assets/img/orgs/nasa.png"
  description: "Mentored and judged global teams working on real-world space, climate, and AI challenges using NASA datasets."
  details: |
    <p>In 2025, I was honored to serve as a <strong>Mentor and Judge at the NASA International Space Apps Challenge</strong>, the world’s largest global hackathon, engaging innovators, engineers, scientists, and students from over 180 countries and territories. This prestigious event, backed by NASA and its global partners, challenges participants to apply creativity and technical expertise to solve some of the world’s most pressing problems on Earth and in space.</p>

    <p>As a judge, I evaluated projects based on innovation, technical depth, scalability, and potential real-world impact, while as a mentor I provided guidance to teams on system design, problem-solving strategies, and execution within the hackathon’s fast-paced environment. My involvement supported participants in transforming ambitious ideas into tangible solutions, reinforcing my commitment to advancing global collaboration, scientific innovation, and the next generation of technology leaders.</p>

