layout: default

<!-- page.html -->
        <div class="post page-surface">

          <header class="post-header">
            <p class="page-eyebrow">{{ page.page_eyebrow | default: "Portfolio Section" }}</p>
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-description">{{ page.description }}</p>
          </header>

          <article class="page-article">
            {{ content }}
          </article>

        </div>
